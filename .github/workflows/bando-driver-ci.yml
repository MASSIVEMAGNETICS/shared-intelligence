name: BANDO_DRIVER CI

on:
  pull_request:
    paths:
      - "bando_driver.py"
      - "bando_sources.py"
      - "tests/test_bando_driver.py"
      - "tests/test_bando_sources.py"
      - ".github/workflows/bando-driver-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_bando_driver.py tests/test_bando_sources.py
      - run: python -m compileall -q bando_driver.py bando_sources.py
