name: BANDO_DRIVER CI

on:
  pull_request:
    paths:
      - "bando_driver.py"
      - "bando_sources.py"
      - "tests/test_bando_driver.py"
      - "tests/test_bando_sources.py"
      - ".github/workflows/bando-driver-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_bando_driver.py tests/test_bando_sources.py
      - run: python -m compileall -q bando_driver.py bando_sources.py
