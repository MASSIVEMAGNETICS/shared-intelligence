name: Daily Empire Maintenance (review-only)
on:
  pull_request:
    paths:
      - '.github/workflows/daily-empire-maintenance.yml'
      - 'bando_driver.py'
      - 'bando_sources.py'
      - 'bando_maintenance_sources.json'
      - 'README.md'
      - 'maintenance_decision.py'
      - 'maintenance_plan.py'
      - 'validate_maintenance_config.py'
      - 'tests/test_bando_driver.py'
      - 'tests/test_bando_sources.py'
      - 'tests/test_maintenance_decision.py'
      - 'tests/test_maintenance_collection.py'
      - 'tests/test_maintenance_config.py'
      - 'tests/test_maintenance_plan.py'
      - 'tests/test_workflow_action_pins.py'
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: empire-maintenance-readonly
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate read-only maintenance source config
        run: python validate_maintenance_config.py --config bando_maintenance_sources.json
      - name: Verify existing BANDO_DRIVER and scheduled decision renderer
        run: |
          python -m compileall -q bando_driver.py bando_sources.py maintenance_decision.py maintenance_plan.py validate_maintenance_config.py
          python -m pip install pytest
          python -m pytest -q tests/test_bando_driver.py tests/test_bando_sources.py tests/test_maintenance_decision.py tests/test_maintenance_collection.py tests/test_maintenance_config.py tests/test_maintenance_plan.py tests/test_workflow_action_pins.py
      - name: Collect bounded objectives (no activation or writes)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p maintenance-output
          python bando_driver.py --registry maintenance-output/registry.json sync \
            --config bando_maintenance_sources.json \
            --no-activate > maintenance-output/sync.json
          python bando_driver.py --registry maintenance-output/registry.json status > maintenance-output/status.json
          python maintenance_decision.py
          python maintenance_plan.py
      - name: Upload inspection artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: empire-maintenance-review-only
          path: maintenance-output/
          if-no-files-found: warn
          retention-days: 14
